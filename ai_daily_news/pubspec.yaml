name: ai_daily_news
description: "Personal serverless AI daily news reader."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.9.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  vellum_engine:
    git:
      url: https://github.com/Aethey/flutter_page_flip.git
      ref: 1.0.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  freezed: ^4.0.1
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  assets:
    - resources/2026-09-12/
