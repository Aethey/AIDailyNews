<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Daily News loop</title>
  <desc id="desc">Agent fetches news into GitHub. The Flutter app reads public JSON. Passive analytics feed the next fetch. No custom database.</desc>
  <rect width="900" height="560" fill="#fffef7"/>
  <text x="50" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1e1e1e">AI Daily News  personal loop, no custom database</text>

  <rect x="50" y="90" width="280" height="110" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text x="190" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e1e1e">Agent + MCP</text>
  <text x="190" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#495057">fetch AI news</text>

  <rect x="570" y="90" width="280" height="110" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="710" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e1e1e">GitHub repo</text>
  <text x="710" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#495057">resources/{date}/news.json</text>

  <rect x="570" y="360" width="280" height="110" rx="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="710" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e1e1e">Flutter app</text>
  <text x="710" y="434" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#495057">public JSON, no paid API</text>

  <rect x="50" y="360" width="280" height="110" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="190" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e1e1e">Firebase Analytics</text>
  <text x="190" y="434" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#495057">passive reading events</text>

  <ellipse cx="450" cy="280" rx="118" ry="44" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
  <text x="450" y="286" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e1e1e">No custom DB</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <line x1="330" y1="145" x2="570" y2="145" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e1e1e">1. commit JSON</text>

  <line x1="710" y1="200" x2="710" y2="360" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e1e1e">2. read (free)</text>

  <line x1="570" y1="415" x2="330" y2="415" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e1e1e">3. track</text>

  <line x1="190" y1="360" x2="190" y2="200" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="92" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e1e1e">4. MCP ’ next fetch</text>
</svg>
